services:
  meshloom:
    # build: .
    # Pin a release (and ideally its digest) in a .env file next to this one:
    #   MESHLOOM_IMAGE=ghcr.io/twinrocket/meshloom:X.Y.Z@sha256:<digest>
    # The digest of each release is in its signed OCI-DIGESTS asset.
    # Without .env this follows :latest.
    image: ${MESHLOOM_IMAGE:-ghcr.io/twinrocket/meshloom:latest}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

    #####################################################################
    # Map your radio by stable device ID if available.                  #
    # If your by-id path contains ':' characters, Docker Compose cannot #
    # represent it here directly; use a colon-free host alias instead.  #
    # (e.g. /dev/ttyUSB0)                                               #
    # Radio transport (serial / TCP / BLE) is configured in the UI.     #
    #####################################################################
    devices:
      - /dev/serial/by-id/your-meshcore-radio:/dev/meshcore-radio

    environment:
      MESHCORE_DATABASE_PATH: data/meshcore.db

      # Optional: run Meshloom as uid 10001 instead of root. The entrypoint
      # hands ./data to that uid and adds the groups of mapped serial devices;
      # if the radio is still not reachable it stays root and logs a warning.
      # Not for Bluetooth (BLE needs root on the host D-Bus).
      # MESHLOOM_RUN_AS_USER: "10001"

      # Security
      # MESHCORE_DISABLE_BOTS: "true"
      # MESHCORE_BASIC_AUTH_USERNAME: changeme
      # MESHCORE_BASIC_AUTH_PASSWORD: changeme

      # Web Push: the contact address (a real mailto: for iPhones) is set in
      # Settings → Notifications. MESHCORE_VAPID_SUBJECT is no longer read.

      # Logging
      # MESHCORE_LOG_LEVEL: INFO
    restart: unless-stopped
