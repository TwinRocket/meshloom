name: Meshloom
version: "4.18.2"
slug: meshloom
description: Talk over your MeshCore mesh — conversations, a live map of what your node hears, packet tools, and MQTT discovery
url: https://github.com/TwinRocket/meshloom
arch:
  - amd64
  - aarch64
  # A Raspberry Pi 3 running Home Assistant is armv7.
  - armv7
init: false

# The web interface is reached through the sidebar. Nothing is published on the
# host for it: ingress terminates TLS and authenticates with Home Assistant, and
# the app already builds its asset URLs relative to whatever prefix it is served
# under, so no base-path configuration is needed.
ingress: true
ingress_port: 8000
panel_icon: mdi:radio-tower
panel_title: Meshloom

# The radio proxy is a plain TCP listener, which ingress does not carry. It is the
# only thing that needs a port on the host, and the host side is remapped here in
# the Network panel rather than inside Meshloom — see the note on ports below.
ports:
  5051/tcp: 5051
  # Unpublished by default: ingress already serves the interface, authenticated by
  # Home Assistant and without opening anything. Give it a host port only to reach
  # Meshloom on a hostname of its own — a tunnel pointing at it directly, which
  # ingress cannot provide since it lives under Home Assistant's own address. Web
  # Push needs such a hostname: open Meshloom at that address to subscribe.
  8000/tcp: null
ports_description:
  5051/tcp: Radio proxy — other MeshCore clients connect here
  8000/tcp: Web interface — only needed to reach it outside Home Assistant, e.g. through a tunnel on its own hostname

# The radio is usually a USB serial adapter.
uart: true
usb: true

# Bluetooth goes through the host's BlueZ over its D-Bus system bus: bleak opens no
# HCI socket of its own, so host_network, privileged and full_access are not needed,
# only the bus (mounted read-only at /run/dbus; talking over it still works).
# Without this the transport is offered but every scan and connection fails.
# The bus is not a narrow grant: the add-on runs as root and nothing mediates D-Bus,
# so any code in it (extensions included) can ask host services such as systemd or logind
# to act as root on the host. DOCS.md says so and advises disable_plugins when exposed.
host_dbus: true

# Everything the instance keeps: database, keys, settings.
map:
  - addon_config:rw

# The shared images cache (<addon_config>/share-cache, up to 200 MiB) is
# rebuilt on demand, and share-tmp only holds uploads in progress: keep both out
# of Home Assistant backups.
backup_exclude:
  - share-cache
  - share-tmp

options:
  log_level: INFO
  proxy_port: 5051
  # DEPRECATED, remove in the next release: copied once into Settings → Notifications.
  vapid_subject: ""
  disable_plugins: false

schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  # The container-side port. It has to match the `ports` key above, so it is stated
  # once here and pushed into Meshloom at startup; the field is read-only in the app
  # for that reason.
  proxy_port: port
  vapid_subject: str?
  disable_plugins: bool?
