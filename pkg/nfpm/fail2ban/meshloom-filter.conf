# fail2ban filter for the Meshloom AUTH_FAIL log line.
#
# Contract: docs/dev/auth-fail-log.md (version 1). The failregex below is that
# page's regex with two changes for fail2ban, and the test
# (tests/test_fail2ban_filter.py, scripts/test/fail2ban_filter.sh) keeps it so:
#   - the timestamp prefix is optional: with a log file fail2ban cuts the date
#     off before matching; with the systemd backend the line is
#     "<host> <ident>[<pid>]: <message>" and the date stays in the message;
#   - ip=<ADDR> is the fail2ban form of (?P<host>\S+).
# A line with proxied=1 (a local peer that is a reverse proxy nobody declared,
# so ip is the proxy, shared by every client behind it) never matches.

[Definition]
failregex = ^(?:\S+ \S+?(?:\[\d+\])?: )?(?:\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})?\s*- meshloom\.auth - WARNING - AUTH_FAIL ip=<ADDR> route=\S+ reason=\S+ via=\S+ proxied=0 user=\S+$

ignoreregex =

# Local time, as the app logs it (the contract's "datepattern").
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
