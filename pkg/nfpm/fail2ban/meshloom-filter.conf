# fail2ban filter for the Meshloom AUTH_FAIL log line.
#
# Contract: docs/dev/auth-fail-log.md (version 1). The failregex below is that
# page's regex with two changes for fail2ban, and the test
# (tests/test_fail2ban_filter.py, scripts/test/fail2ban_filter.sh) keeps it so:
#   - what comes before " - meshloom.auth" is one of the two forms fail2ban
#     hands over: with the systemd backend "<host> <ident>[<pid>]: " and the
#     date (it stays in the message); with a log file nothing but the space
#     before the dash (fail2ban cuts the date off before matching);
#   - ip=<ADDR> is the fail2ban form of (?P<host>\S+).
# The app caps every log line at 8 KiB, so journald (48 KiB) and Docker
# (16 KiB) never split one into an entry that starts with client text (MSHL-435).
# A line with proxied=1 (a local peer that is a reverse proxy nobody declared,
# so ip is the proxy, shared by every client behind it) never matches.

[Definition]
failregex = ^(?:\S+ \S+?(?:\[\d+\])?: \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} | ?)- meshloom\.auth - WARNING - AUTH_FAIL ip=<ADDR> route=\S+ reason=\S+ via=\S+ proxied=0 user=\S+$

ignoreregex =

# Local time, as the app logs it (the contract's "datepattern").
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
