# fail2ban jail for Meshloom. SHIPPED DISABLED: set "enabled = true" (see
# docs/user/en/deep/fail2ban.md) and run "sudo fail2ban-client reload".
# Meshloom also has a built-in ban; this jail is the firewall-level
# complement for installs that run fail2ban already.
#
# Package install: the service logs to the systemd journal. Docker: see the
# user doc (container logs, chain = DOCKER-USER).

[meshloom]
enabled = false
filter = meshloom
backend = systemd
journalmatch = _SYSTEMD_UNIT=meshloom.service
port = 8000
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
