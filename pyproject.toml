[project]
name = "meshloom"
version = "4.18.2"
description = "Meshloom - Web interface for MeshCore radio mesh networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.28.1",
    "websockets>=14.0",
    # 4.x: only AES (ECB, GCM) and scrypt are used, unaffected by the 4.0 breaking changes (#285).
    "pycryptodome>=4.0.1,<5",
    "pynacl>=1.5.0",
    "meshcore==2.3.17",
    # meshcore declares bleak=* (unpinned). Meshloom imports bleak only for the
    # availability probe and BleakScanner.discover; the rest goes through meshcore.
    # Bleak 3 on Linux subscribes with BlueZ StartNotify instead of AcquireNotify.
    "bleak>=2.1,<4",
    "aiomqtt>=2.0",
    "apprise>=2.0.1",  # inline cid: attachments (alert email logo)
    # Notification sends: retry policy and the per-medium send interval.
    "tenacity>=9.2.1",
    "aiolimiter>=1.3.0",
    "boto3>=1.38.0",
    "pywebpush>=0.14.0",
    "packaging>=26.3",
    # BLE PIN pairing talks to BlueZ directly (app/services/ble_pairing.py).
    # Upper bound: [tool.uv] constraint-dependencies.
    "dbus-fast>=3.1; sys_platform == 'linux'",
    # Plugin config.schema.json validation (app/plugins/config_schema.py); pulls rpds-py.
    "jsonschema>=4.26,<5",
    # TOTP second factor, RFC 6238 (app/auth/totp.py).
    "pyotp>=2.9,<3",
    # Passkeys, WebAuthn ceremonies (py_webauthn; app/auth/webauthn.py).
    "webauthn>=3.0.1,<4",
    "diskcache>=5.6.3,<5.7",
    "imagesize>=2.0.1,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto --dist worksteal -m 'not slow'"
markers = [
    "radio: opt-in bench against a live instance and its radio (docs/dev/radio-bench.md)",
    "slow: large-fixture timing tests, outside the quality gate (run with -m slow)",
    "real_auth: keep the real auth gate (tests/conftest.py signs app requests in as an admin otherwise)",
    "async_notifications: keep the dispatcher asynchronous (tests/conftest.py waits for its queues after each emit otherwise)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress - doesn't work well with async code
    "SIM108", # ternary operator (sometimes less readable)
    "SIM117", # nested with statements - can be clearer in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app", "meshloom_plugin"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app", "meshloom_plugin"]
exclude = ["references", ".venv", "tests"]
reportMissingImports = true
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.4",
    "pip-licenses>=5.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "hypothesis>=6.170",
    # Linux-only at runtime (see dependencies); installed on every platform in
    # dev so pyright resolves the BlueZ imports on macOS too.
    "dbus-fast>=3.1,<4",
]

[tool.uv]
# bleak 3 still requires dbus-fast>=1.83 on Linux without an upper bound, which
# would pull dbus-fast 5; keep the 3.x line until dbus-fast 4+ is evaluated on
# BLE hardware.
constraint-dependencies = ["dbus-fast>=3.1,<4"]
