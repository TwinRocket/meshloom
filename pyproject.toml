[project]
name = "meshloom"
version = "4.10.1"
description = "Meshloom - Web interface for MeshCore radio mesh networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.28.1",
    "websockets>=14.0",
    "pycryptodome>=3.20.0",
    "pynacl>=1.5.0",
    "meshcore==2.3.9.1",
    # meshcore declares bleak=* and has not stated Bleak 3 compatibility.
    "bleak>=2.1,<3",
    "aiomqtt>=2.0",
    "apprise>=1.9.8",
    "boto3>=1.38.0",
    "pywebpush>=0.14.0",
    "packaging>=26.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto --dist worksteal"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress - doesn't work well with async code
    "SIM108", # ternary operator (sometimes less readable)
    "SIM117", # nested with statements - can be clearer in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app"]
exclude = ["references", ".venv", "tests"]
reportMissingImports = true
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.4",
    "pip-licenses>=5.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.uv]
# dbus-fast 5 is pulled by an unpinned bleak 2.x Linux extra; keep the 3.x line
# until Bleak 3 is an explicit, hardware-tested upgrade.
constraint-dependencies = ["dbus-fast>=3.1,<4"]
