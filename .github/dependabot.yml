# Weekly update PRs. Minor and patch bumps are grouped into one PR per
# ecosystem; majors stay individual so each one is reviewed on its own.
# GitHub Actions and Docker base images are pinned by digest/SHA: Dependabot
# bumps the pin and keeps the version comment in step.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    # Odd Node majors are not LTS; add 29.x later.
    ignore:
      - dependency-name: "@types/node"
        versions: ["27.x"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Odd Node majors are not LTS; add "~> 29.0" later. A node major bump
    # here must change .nvmrc in the same PR (CI, .deb and release zip use it).
    ignore:
      - dependency-name: node
        versions: ["~> 27.0"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
