# Weekly update PRs. Minor and patch bumps are grouped into one PR per
# ecosystem; majors stay individual so each one is reviewed on its own (except
# the CodeQL actions, which must move together).
# GitHub Actions and Docker base images are pinned by digest/SHA: Dependabot
# bumps the pin and keeps the version comment in step.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      # init/autobuild/analyze must share one version: a split bump fails
      # ("Loaded a configuration file for version 3…, but running version 4…").
      # No update-types, so majors land here too, in one PR.
      codeql:
        patterns: ["github/codeql-action*"]
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    # @types/node follows the Node runtime (26 LTS, see .nvmrc): majors are
    # manual decisions. From Node 27 on, every major becomes LTS (Current in
    # April, LTS in October); move once it reaches LTS, with .nvmrc.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Node majors are manual decisions: from Node 27 on, every major becomes
    # LTS (Current in April, LTS in October); move once it reaches LTS. A node
    # major bump must change .nvmrc in the same PR (CI, .deb and release zip).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
