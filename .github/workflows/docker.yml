name: Docker

# Builds and pushes the multi-arch container image to GHCR. Runs on pushes to
# main (tagged :edge), on pushes to the 5.0.0 integration branch preversion-5
# (tagged :next), on version tags (tagged :latest, :X.Y.Z and :X.Y), and on
# demand. Pull requests build only, to catch Dockerfile breakage without
# publishing. After a main build, the deploy job calls the redeploy webhooks in
# EDGE_DEPLOY_WEBHOOKS (stacks on docker-compose.dev.yaml); after a preversion-5
# build it calls those in NEXT_DEPLOY_WEBHOOKS (the meshloom-next stack, MSHL-270).
#
# forward-merge.yml merges main into preversion-5 through a PR auto-merged with
# GITHUB_TOKEN, and a merge made with that token starts no workflow, so it waits
# for the merge and dispatches this workflow on preversion-5 itself
# (workflow_dispatch): that run is the one that publishes :next.
#
# One job per architecture rather than one job building all of them: buildx on a
# single runner shares four cores between three platforms, two of which run under
# emulation. Split, the release waits for the slowest architecture instead of the
# sum of all three.

on:
  push:
    branches: [main, preversion-5]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Only supersede PR builds. A tag build must finish or the release ships with
  # no image, and cancelling main builds made the README's Docker badge read
  # "failing" whenever two commits landed close together: the badge reports the
  # last run on the default branch, and a cancelled run renders as a failure.
  # preversion-5 gets its own group (its ref) and the same rule: a :next build
  # is never cancelled, the next one queues behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The image name is derived in the first job rather than here: a registry reference
# must be lowercase, and an owner is free to have capitals in it. `TwinRocket`
# does, and every push failed on it the moment the repository moved.

# Least privilege: each job states what it needs.
permissions: {}

jobs:
  # Pull requests already run All Quality as their own workflow; every other
  # event (main, a version tag, a manual run) must pass it before any image is
  # built, let alone pushed.
  quality:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/all-quality.yml
    permissions:
      contents: read

  matrix:
    name: Architectures
    needs: quality
    # `quality` is skipped on pull requests; anything else must have passed it.
    if: ${{ !cancelled() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      include: ${{ steps.pick.outputs.include }}
      image: ${{ steps.pick.outputs.image }}
    steps:
      # A pull request builds one architecture. The other two only ever run under
      # emulation, and a Dockerfile mistake shows up on the first one.
      - name: Decide what to build
        id: pick
        run: |
          amd64='{"platform":"linux/amd64","slug":"amd64","runner":"ubuntu-latest"}'
          arm64='{"platform":"linux/arm64","slug":"arm64","runner":"ubuntu-24.04-arm"}'
          armv7='{"platform":"linux/arm/v7","slug":"armv7","runner":"ubuntu-latest"}'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "include=[$amd64]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$amd64,$arm64,$armv7]" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.slug }}
    needs: matrix
    # Without this, the implicit success() also looks at `quality`, which is
    # skipped on pull requests, so the PR build never ran. Pull requests still
    # push nothing: no GHCR login, outputs=type=cacheonly, no cache-to, and the
    # digest steps and `merge` are skipped.
    if: ${{ !cancelled() && needs.matrix.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 builds on arm64 hardware, so it needs no emulation. armv7 does:
      # no runner executes 32-bit ARM, and no Debian-based image publishes the
      # compilers it needs for another architecture.
      - name: Set up QEMU
        if: matrix.slug == 'armv7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and assembled into one tag afterwards: each job pushes an
      # image nobody can pull yet, and the merge job is what makes the tag exist.
      # A tag written three times would otherwise be whichever job finished last.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: COMMIT_HASH=${{ github.sha }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.matrix.outputs.image) || 'type=cacheonly' }}
          provenance: false
          # Kept in the registry rather than in the Actions cache: the Actions
          # cache is scoped per ref and evicted after a week, so a release tag —
          # the build that can least afford a cold start — was the one guaranteed
          # to miss it. A registry ref is the same for every branch and tag.
          cache-from: type=registry,ref=${{ needs.matrix.outputs.image }}:buildcache-${{ matrix.slug }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.matrix.outputs.image, matrix.slug) || '' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Manifest
    if: github.event_name != 'pull_request'
    needs: [matrix, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.matrix.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/preversion-5' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.matrix.outputs.image }}@sha256:%s ' *)

      - name: Show what was published
        id: index
        run: |
          IMAGE="${{ needs.matrix.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$IMAGE"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest for $IMAGE"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The signed SHA256SUMS (sign-manifest.yml) pins this same index digest;
      # the attestation ties it to this workflow run and commit.
      - name: Attest image provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.matrix.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # Redeploys the stacks that run :edge after a main build (EDGE_DEPLOY_WEBHOOKS,
  # stacks on docker-compose.dev.yaml). A stack polling Git would redeploy a few
  # minutes too early and pull the previous image. The webhook URLs live in that
  # secret, one per line: anyone holding one can trigger a redeploy, so they never
  # appear in the repository or in the logs. No secret (forks, or a stack not
  # created yet): a notice, nothing to do.
  # Portainer sits behind Cloudflare Access, which redirects GitHub-hosted runners
  # to its login page (HTTP 302). CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET hold
  # an Access service token that the Access application accepts (Service Auth
  # policy); when both are set, every call sends them as CF-Access-Client-* headers.
  # preversion-5 (:next) works the same way with NEXT_DEPLOY_WEBHOOKS: mininode1's
  # Portainer is published through the same Cloudflare tunnel and Access application,
  # so the job stays on GitHub-hosted runners (a self-hosted runner is not an option
  # on this public repository: a fork pull request could run code on the owner's
  # machine). Portainer's git-stack webhook reads no query parameter (no `pullimage`),
  # so whether a redeploy pulls a new :next is the stack's own "Re-pull image" setting.
  deploy:
    # A static name, so the required check keeps its name on every ref.
    name: Deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preversion-5'
    needs: merge
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Call the edge redeploy webhooks
        if: github.ref == 'refs/heads/main'
        env:
          EDGE_WEBHOOKS: ${{ secrets.EDGE_DEPLOY_WEBHOOKS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          WEBHOOKS="$EDGE_WEBHOOKS"
          unset EDGE_WEBHOOKS
          if [ -z "$WEBHOOKS" ]; then
            echo "::notice::EDGE_DEPLOY_WEBHOOKS is not set; no stack to redeploy"
            exit 0
          fi
          # The token goes through a private header file, never through argv.
          access="$(mktemp)"
          trap 'rm -f "$access"' EXIT
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' \
              "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > "$access"
          else
            echo "::notice::No Cloudflare Access service token; webhooks are called without one"
          fi
          n=0
          while IFS= read -r url; do
            url="${url%%[[:space:]]}"
            [ -n "$url" ] || continue
            n=$((n + 1))
            headers="$(mktemp)"
            # No -f/-L: a redirect or a challenge page (a proxy in front of
            # Portainer) must show up as a failure, not as a success.
            code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X POST \
              -H @"$access" --max-time 60 --retry 2 --retry-all-errors "$url")" || true
            code="${code:-000}"
            # Never print the URL; the status and a few response headers are enough.
            info="$(grep -iE '^(server|cf-mitigated|location|content-type):' "$headers" \
              | sed -E 's#^(location:[[:space:]]*https?://[^/]+).*#\1/...#I' | tr -d '\r' | paste -sd ';' -)" || true
            rm -f "$headers"
            if [[ "$code" == 2* ]]; then
              echo "Webhook $n: HTTP $code, redeploy requested ($info)"
            else
              # A down Portainer must not turn the image build red.
              echo "::warning::Webhook $n: HTTP $code ($info); that stack keeps the previous image"
            fi
          done <<< "$WEBHOOKS"
      - name: Call the next redeploy webhooks
        if: github.ref == 'refs/heads/preversion-5'
        env:
          NEXT_WEBHOOKS: ${{ secrets.NEXT_DEPLOY_WEBHOOKS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          WEBHOOKS="$NEXT_WEBHOOKS"
          unset NEXT_WEBHOOKS
          if [ -z "$WEBHOOKS" ]; then
            echo "::notice::NEXT_DEPLOY_WEBHOOKS is not set; no stack to redeploy"
            exit 0
          fi
          # The token goes through a private header file, never through argv.
          access="$(mktemp)"
          trap 'rm -f "$access"' EXIT
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' \
              "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > "$access"
          else
            echo "::notice::No Cloudflare Access service token; webhooks are called without one"
          fi
          n=0
          while IFS= read -r url; do
            url="${url%%[[:space:]]}"
            [ -n "$url" ] || continue
            n=$((n + 1))
            headers="$(mktemp)"
            # No -f/-L: a redirect or a challenge page (a proxy in front of
            # Portainer) must show up as a failure, not as a success.
            code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X POST \
              -H @"$access" --max-time 60 --retry 2 --retry-all-errors "$url")" || true
            code="${code:-000}"
            # Never print the URL; the status and a few response headers are enough.
            info="$(grep -iE '^(server|cf-mitigated|location|content-type):' "$headers" \
              | sed -E 's#^(location:[[:space:]]*https?://[^/]+).*#\1/...#I' | tr -d '\r' | paste -sd ';' -)" || true
            rm -f "$headers"
            if [[ "$code" == 2* ]]; then
              echo "Webhook $n: HTTP $code, redeploy requested ($info)"
            else
              # A down Portainer must not turn the image build red.
              echo "::warning::Webhook $n: HTTP $code ($info); that stack keeps the previous image"
            fi
          done <<< "$WEBHOOKS"
