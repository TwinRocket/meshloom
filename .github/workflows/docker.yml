name: Docker

# Builds and pushes the multi-arch container image to GHCR. Runs on pushes to
# main (tagged :edge), on published releases and version tags (tagged :latest
# and :X.Y.Z), and on demand. Pull requests build only, to catch Dockerfile
# breakage without publishing. After a main build, the deploy-edge job calls the
# redeploy webhooks in EDGE_DEPLOY_WEBHOOKS (stacks on docker-compose.dev.yaml).
#
# One job per architecture rather than one job building all of them: buildx on a
# single runner shares four cores between three platforms, two of which run under
# emulation. Split, the release waits for the slowest architecture instead of the
# sum of all three.

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Only supersede PR builds. A tag build must finish or the release ships with
  # no image, and cancelling main builds made the README's Docker badge read
  # "failing" whenever two commits landed close together: the badge reports the
  # last run on the default branch, and a cancelled run renders as a failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The image name is derived in the first job rather than here: a registry reference
# must be lowercase, and an owner is free to have capitals in it. `TwinRocket`
# does, and every push failed on it the moment the repository moved.

# Least privilege: each job states what it needs.
permissions: {}

jobs:
  # Pull requests already run All Quality as their own workflow; every other
  # event (main, a version tag, a manual run) must pass it before any image is
  # built, let alone pushed.
  quality:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/all-quality.yml
    permissions:
      contents: read

  matrix:
    name: Architectures
    needs: quality
    # `quality` is skipped on pull requests; anything else must have passed it.
    if: ${{ !cancelled() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      include: ${{ steps.pick.outputs.include }}
      image: ${{ steps.pick.outputs.image }}
    steps:
      # A pull request builds one architecture. The other two only ever run under
      # emulation, and a Dockerfile mistake shows up on the first one.
      - name: Decide what to build
        id: pick
        run: |
          amd64='{"platform":"linux/amd64","slug":"amd64","runner":"ubuntu-latest"}'
          arm64='{"platform":"linux/arm64","slug":"arm64","runner":"ubuntu-24.04-arm"}'
          armv7='{"platform":"linux/arm/v7","slug":"armv7","runner":"ubuntu-latest"}'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "include=[$amd64]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$amd64,$arm64,$armv7]" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.slug }}
    needs: matrix
    # Without this, the implicit success() also looks at `quality`, which is
    # skipped on pull requests, so the PR build never ran. Pull requests still
    # push nothing: no GHCR login, outputs=type=cacheonly, no cache-to, and the
    # digest steps and `merge` are skipped.
    if: ${{ !cancelled() && needs.matrix.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # arm64 builds on arm64 hardware, so it needs no emulation. armv7 does:
      # no runner executes 32-bit ARM, and no Debian-based image publishes the
      # compilers it needs for another architecture.
      - name: Set up QEMU
        if: matrix.slug == 'armv7'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and assembled into one tag afterwards: each job pushes an
      # image nobody can pull yet, and the merge job is what makes the tag exist.
      # A tag written three times would otherwise be whichever job finished last.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: COMMIT_HASH=${{ github.sha }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.matrix.outputs.image) || 'type=cacheonly' }}
          provenance: false
          # Kept in the registry rather than in the Actions cache: the Actions
          # cache is scoped per ref and evicted after a week, so a release tag —
          # the build that can least afford a cold start — was the one guaranteed
          # to miss it. A registry ref is the same for every branch and tag.
          cache-from: type=registry,ref=${{ needs.matrix.outputs.image }}:buildcache-${{ matrix.slug }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.matrix.outputs.image, matrix.slug) || '' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Manifest
    if: github.event_name != 'pull_request'
    needs: [matrix, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.matrix.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.matrix.outputs.image }}@sha256:%s ' *)

      - name: Show what was published
        id: index
        run: |
          IMAGE="${{ needs.matrix.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$IMAGE"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest for $IMAGE"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The signed SHA256SUMS (sign-manifest.yml) pins this same index digest;
      # the attestation ties it to this workflow run and commit.
      - name: Attest image provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.matrix.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # Redeploys the stacks that run :edge (docker-compose.dev.yaml) once the new
  # image exists. A stack polling Git would redeploy a few minutes too early and
  # pull the previous :edge. The webhook URLs live in the EDGE_DEPLOY_WEBHOOKS
  # secret, one per line: anyone holding one can trigger a redeploy, so they never
  # appear in the repository or in the logs. No secret (forks): nothing to do.
  deploy-edge:
    name: Deploy edge
    if: github.ref == 'refs/heads/main'
    needs: merge
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Call the redeploy webhooks
        env:
          WEBHOOKS: ${{ secrets.EDGE_DEPLOY_WEBHOOKS }}
        run: |
          if [ -z "$WEBHOOKS" ]; then
            echo "::notice::EDGE_DEPLOY_WEBHOOKS is not set; no stack to redeploy"
            exit 0
          fi
          n=0
          while IFS= read -r url; do
            url="${url%%[[:space:]]}"
            [ -n "$url" ] || continue
            n=$((n + 1))
            headers="$(mktemp)"
            # No -f/-L: a redirect or a challenge page (a proxy in front of
            # Portainer) must show up as a failure, not as a success.
            code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X POST \
              --max-time 60 --retry 2 --retry-all-errors "$url")" || true
            code="${code:-000}"
            # Never print the URL; the status and a few response headers are enough.
            info="$(grep -iE '^(server|cf-mitigated|location|content-type):' "$headers" \
              | sed -E 's#^(location:[[:space:]]*https?://[^/]+).*#\1/...#I' | tr -d '\r' | paste -sd ';' -)" || true
            rm -f "$headers"
            if [[ "$code" == 2* ]]; then
              echo "Webhook $n: HTTP $code, redeploy requested ($info)"
            else
              # A down Portainer must not turn the image build red.
              echo "::warning::Webhook $n: HTTP $code ($info); that stack keeps the previous image"
            fi
          done <<< "$WEBHOOKS"
