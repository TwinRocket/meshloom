name: nFPM packages

# Build amd64 .deb/.rpm on pull requests so packaging breaks are caught
# without publishing a release.

on:
  pull_request:
    paths:
      - "pkg/nfpm/**"
      - "pkg/keys/**"
      - "scripts/build/check_*"
      - "scripts/build/build_nfpm_packages.sh"
      - "scripts/build/neutralize_project_version.py"
      - "Dockerfile.nfpm-armhf"
      - "Dockerfile.nfpm-armhf.dockerignore"
      - "app/**"
      - ".nvmrc"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/**"
      - ".github/workflows/nfpm.yml"
      - ".github/workflows/nfpm-armhf.yml"

permissions: {}

jobs:
  nfpm-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Placeholders are tolerated on pull requests (packaging is still tested,
      # unsigned); a real key in pkg/keys is validated in full.
      - name: Check signing trust anchor
        run: scripts/build/check_signing_keys.sh --allow-placeholder

      - name: Install nFPM
        run: |
          NFPM_VER=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | tar -xz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      # Three steps: the armhf release path is --deps-only, --skip-deps, then
      # --package-only. Exercising that split here (still amd64, no QEMU)
      # is cheaper than discovering it when publishing.
      - name: Build amd64 packages
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          scripts/build/build_nfpm_packages.sh \
            --version "$VERSION" \
            --arch amd64 \
            --stage-dir stage-amd64 \
            --deps-only
          scripts/build/build_nfpm_packages.sh \
            --version "$VERSION" \
            --arch amd64 \
            --stage-dir stage-amd64 \
            --skip-deps
          scripts/build/build_nfpm_packages.sh \
            --version "$VERSION" \
            --arch amd64 \
            --stage-dir stage-amd64 \
            --package-only \
            --output-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfpm-amd64-pr
          path: dist/*
