name: Release

# Builds the prebuilt-frontend zip, Linux .deb/.rpm packages, publishes the
# GitHub release, then bakes the Raspberry Pi Lite image from the arm64 .deb
# in this same run (a second workflow would not start: GITHUB_TOKEN releases
# do not trigger on.release). The armhf package is workflow_dispatch'd after
# publish so QEMU does not block a re-run. Cut a release with
# scripts/build/publish.sh, then:
#   git tag X.Y.Z && git push origin X.Y.Z
#
# Signing (pkg/keys/README.md): `preflight` refuses to start unless the four
# version sources equal the tag and the CI secret MESHLOOM_REPO_GPG_PRIVATE_KEY
# is the private half of the key committed in pkg/keys. Packages are signed by
# nFPM, the apt/dnf repo by publish-linux-repo.yml, and `sign-manifest` leaves
# SHA256SUMS + OCI-DIGESTS (the OCI index digest) and their .asc on the release;
# nfpm-armhf.yml re-runs both once the armhf package is attached.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no v prefix, e.g. 4.0.0)"
        required: true

# Least privilege: every job below states what it needs.
permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$RAW_VERSION' is not X.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The same lint, typecheck and test suite as every push, on the tagged commit.
  # Nothing is built or published unless it passes (preflight waits for it, and
  # every later job waits for preflight).
  quality:
    needs: version
    uses: ./.github/workflows/all-quality.yml
    permissions:
      contents: read

  # Fail before building anything: the four version sources must equal the tag,
  # and the signing trust anchor must be real and match the CI secret. A release
  # without a key would otherwise ship packages nobody can verify.
  preflight:
    needs: [version, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Version consistency
        run: scripts/build/check_version_consistency.sh "${{ needs.version.outputs.version }}"

      - name: Signing key (pkg/keys and secret)
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

  frontend:
    needs: [version, preflight]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Package prebuilt zip
        id: artifact
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          GIT_HASH="$(git rev-parse --short HEAD)"
          ASSET="meshloom-prebuilt-frontend-v${VERSION}-${GIT_HASH}.zip"
          scripts/build/package_release_artifact.sh \
            --version "$VERSION" \
            --git-hash "$GIT_HASH" \
            --full-git-hash "$(git rev-parse HEAD)" \
            --output "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-zip
          path: ${{ steps.artifact.outputs.asset }}

  nfpm:
    needs: [version, frontend]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install nFPM
        run: |
          NFPM_VER=2.46.3
          case "$(uname -m)" in
            aarch64|arm64) NFPM_ARCH=Linux_arm64 ;;
            *) NFPM_ARCH=Linux_x86_64 ;;
          esac
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_${NFPM_ARCH}.tar.gz" \
            | tar -xz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

      - name: Build packages
        env:
          MESHLOOM_REQUIRE_SIGNED: "1"
          MESHLOOM_SIGN_KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ needs.version.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir dist \
            --skip-frontend

      - name: Assert the rpm is signed
        run: python3 -I scripts/build/check_rpm_signed.py dist/*.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nfpm-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [version, frontend, nfpm]
    runs-on: ubuntu-latest
    # Draft + one-file uploads + retries. GitHub's asset API can spend
    # several minutes on a single ~80MB package with no TTY progress.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-zip
          path: artifacts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nfpm-amd64
          path: artifacts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nfpm-arm64
          path: artifacts

      - name: Stage install.sh
        run: cp scripts/setup/install.sh artifacts/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ASSET_ARGS=()
          while IFS= read -r file; do
            ASSET_ARGS+=(--asset "$file")
          done < <(find artifacts -type f | sort)
          scripts/build/create_github_release.sh \
            --version "${{ needs.version.outputs.version }}" \
            --full-git-hash "$(git rev-parse HEAD)" \
            "${ASSET_ARGS[@]}"

  # armhf lives in nfpm-armhf.yml: a GITHUB_TOKEN release does not trigger
  # on.release, but it can workflow_dispatch. That keeps QEMU off this run so
  # a failed publish can be re-run without waiting on emulation.
  dispatch-armhf:
    name: Dispatch armhf package
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start armhf workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nfpm-armhf.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="${{ needs.version.outputs.version }}"

  # Publishes amd64/arm64 immediately. The armhf workflow refreshes the index
  # once that package is attached, rather than holding this run for QEMU.
  linux-repo:
    needs: [version, publish]
    uses: ./.github/workflows/publish-linux-repo.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  # SHA256SUMS + OCI-DIGESTS and their .asc (packages, zip, install.sh; image digest).
  # Waits for docker.yml's image. Re-run by nfpm-armhf.yml once armhf is attached.
  sign-manifest:
    needs: [version, publish]
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
      attestations: write

  # Same workflow as nfpm/publish so the .deb is already an artifact and the
  # GITHUB_TOKEN can attach the image. A separate on.release workflow would
  # never start.
  rpi-image:
    needs: [version, nfpm, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nfpm-arm64
          path: incoming

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kpartx xz-utils fdisk cloud-guest-utils e2fsprogs

      - name: Build Raspberry Pi Lite image
        run: |
          chmod +x scripts/build/build_rpi_image.sh
          DEB="$(find incoming -name '*_arm64.deb' | head -n 1)"
          [ -n "$DEB" ] || { echo "arm64 .deb missing from nfpm-arm64 artifact" >&2; exit 1; }
          sudo scripts/build/build_rpi_image.sh --deb "$DEB" --output-dir dist \
            --version "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meshloom-rpi-lite-arm64
          path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest
          if-no-files-found: error

      - name: Attest provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest

      - name: Attach image to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.version }}" \
            dist/meshloom-rpi-lite-arm64.img.xz \
            dist/meshloom.rpi-imager-manifest \
            --repo "${{ github.repository }}" \
            --clobber
