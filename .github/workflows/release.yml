name: Release

# Builds the prebuilt-frontend zip, Linux .deb/.rpm packages, publishes the
# GitHub release, then bakes the Raspberry Pi Lite image from the arm64 .deb
# in this same run (a second workflow would not start: GITHUB_TOKEN releases
# do not trigger on.release). Cut a release with scripts/build/publish.sh, then:
#   git tag X.Y.Z && git push origin X.Y.Z

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no v prefix, e.g. 4.0.0)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  frontend:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Package prebuilt zip
        id: artifact
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          GIT_HASH="$(git rev-parse --short HEAD)"
          ASSET="meshloom-prebuilt-frontend-v${VERSION}-${GIT_HASH}.zip"
          scripts/build/package_release_artifact.sh \
            --version "$VERSION" \
            --git-hash "$GIT_HASH" \
            --full-git-hash "$(git rev-parse HEAD)" \
            --output "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-zip
          path: ${{ steps.artifact.outputs.asset }}

  nfpm:
    needs: [version, frontend]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: astral-sh/setup-uv@v6

      - name: Install nFPM
        run: |
          NFPM_VER=2.46.3
          case "$(uname -m)" in
            aarch64|arm64) NFPM_ARCH=Linux_arm64 ;;
            *) NFPM_ARCH=Linux_x86_64 ;;
          esac
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_${NFPM_ARCH}.tar.gz" \
            | tar -xz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build packages
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ needs.version.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir dist \
            --skip-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: nfpm-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [version, frontend, nfpm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: frontend-zip
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: nfpm-amd64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: nfpm-arm64
          path: artifacts

      - name: Stage install.sh
        run: cp scripts/setup/install.sh artifacts/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ASSET_ARGS=()
          while IFS= read -r file; do
            ASSET_ARGS+=(--asset "$file")
          done < <(find artifacts -type f | sort)
          scripts/build/create_github_release.sh \
            --version "${{ needs.version.outputs.version }}" \
            --full-git-hash "$(git rev-parse HEAD)" \
            "${ASSET_ARGS[@]}"

  # Same workflow as nfpm/publish so the .deb is already an artifact and the
  # GITHUB_TOKEN can attach the image. A separate on.release workflow would
  # never start.
  rpi-image:
    needs: [version, nfpm, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: nfpm-arm64
          path: incoming

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kpartx xz-utils fdisk cloud-guest-utils e2fsprogs

      - name: Build Raspberry Pi Lite image
        run: |
          chmod +x scripts/build/build_rpi_image.sh
          DEB="$(find incoming -name '*_arm64.deb' | head -n 1)"
          [ -n "$DEB" ] || { echo "arm64 .deb missing from nfpm-arm64 artifact" >&2; exit 1; }
          sudo scripts/build/build_rpi_image.sh --deb "$DEB" --output-dir dist \
            --version "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: meshloom-rpi-lite-arm64
          path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest
          if-no-files-found: error

      - name: Attach image to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.version }}" \
            dist/meshloom-rpi-lite-arm64.img.xz \
            dist/meshloom.rpi-imager-manifest \
            --repo "${{ github.repository }}" \
            --clobber
