name: Release

# Builds the prebuilt-frontend zip, Linux .deb/.rpm packages, publishes the
# GitHub release, then bakes the Raspberry Pi Lite image from the arm64 .deb
# in this same run (a second workflow would not start: GITHUB_TOKEN releases
# do not trigger on.release). The armhf package is workflow_dispatch'd after
# publish so QEMU does not block a re-run.
#
# Cutting a release (no workflow pushes main or creates a tag): an admin writes
# the [X.Y.Z] section of CHANGELOG.md and runs scripts/build/publish.sh X.Y.Z,
# which commits the version bump, pushes main, then pushes the annotated X.Y.Z
# tag that starts this workflow. If main went out but the tag did not,
# scripts/build/tag_release.sh X.Y.Z pushes the tag.
# workflow_dispatch only re-publishes an existing tag: start it on the tag
# itself (`gh workflow run release.yml --ref X.Y.Z`), never on a branch.
#
# Signing (pkg/keys/README.md): `preflight` refuses to start unless the four
# version sources equal the tag and the CI secret MESHLOOM_REPO_GPG_PRIVATE_KEY
# is the private half of the key committed in pkg/keys. Packages are signed by
# nFPM, the apt/dnf repo by publish-linux-repo.yml, and `sign-manifest` leaves
# SHA256SUMS + OCI-DIGESTS (the OCI index digest) and their .asc on the release;
# nfpm-armhf.yml re-runs both once the armhf package is attached.
#
# Key exposure: every job that runs third-party code (npm, uv, build backends) has
# no key and no write token. `nfpm-stage` assembles the tree, `nfpm` signs it and
# runs nothing but the pinned nFPM. Key-holding jobs use the `release-signing`
# environment; `signing-environment` refuses to go on unless that environment is
# limited to release refs.
#
# A tag X.Y.Z-rc.N (scripts/build/publish.sh X.Y.Z-rc.N) goes through the same jobs
# and ends as a signed pre-release: a GitHub pre-release that is never `latest`, the
# apt/dnf `testing` suite, `:X.Y.Z-rc.N` and its signed digest, the Pi image. It
# skips armhf and the site, and stable users get nothing. docs/dev/releasing.md.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
  # Re-publish an existing tag only: run it with --ref X.Y.Z. Every job then
  # checks out the tagged commit, and create_github_release.sh refuses to run
  # unless the tag is on origin and points at it.
  workflow_dispatch:

# Least privilege: every job below states what it needs.
permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          RAW_VERSION: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release runs on an existing X.Y.Z or X.Y.Z-rc.N tag only. Re-publish with: gh workflow run release.yml --ref X.Y.Z (tags come from scripts/build/publish.sh)."
            exit 1
          fi
          VERSION="$RAW_VERSION"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            PRERELEASE=true
          else
            echo "::error::'$RAW_VERSION' is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  # The same lint, typecheck and test suite as every push, on the tagged commit.
  # Nothing is built or published unless it passes (preflight waits for it, and
  # every later job waits for preflight).
  quality:
    needs: version
    uses: ./.github/workflows/all-quality.yml
    permissions:
      contents: read

  # Before any job names the environment: GitHub would create a missing one with no
  # protection. No key here, and the token can read nothing private.
  signing-environment:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the signing environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/build/check_signing_environment.py "$GITHUB_REPOSITORY"

  # Fail before building anything: the version sources must equal the tag (an rc
  # leaves the add-on on its stable version), and the signing trust anchor must be
  # real and match the CI secret. A release without a key would otherwise ship
  # packages nobody can verify.
  preflight:
    needs: [version, quality, signing-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version consistency
        run: scripts/build/check_version_consistency.sh "${{ needs.version.outputs.version }}"

      - name: Signing key (pkg/keys and secret)
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

  frontend:
    needs: [version, preflight]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Package prebuilt zip
        id: artifact
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          GIT_HASH="$(git rev-parse --short HEAD)"
          ASSET="meshloom-prebuilt-frontend-v${VERSION}-${GIT_HASH}.zip"
          scripts/build/package_release_artifact.sh \
            --version "$VERSION" \
            --git-hash "$GIT_HASH" \
            --full-git-hash "$(git rev-parse HEAD)" \
            --output "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-zip
          path: ${{ steps.artifact.outputs.asset }}

  # No key here: `uv sync` runs build backends the lock does not pin (a sdist's
  # build-system), and the standalone Python and uv are downloaded.
  nfpm-stage:
    needs: [version, frontend]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"

      - name: Assemble the tree
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ needs.version.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --stage-dir "$RUNNER_TEMP/stage" \
            --stage-only \
            --skip-frontend

      # A tarball: an artifact would lose the symlinks and the file modes.
      - name: Pack the tree
        run: tar -C "$RUNNER_TEMP/stage" -czf stage.tar.gz .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfpm-stage-${{ matrix.arch }}
          path: stage.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Holds the key and runs only the checked-out scripts and the pinned nFPM. The
  # tree from nfpm-stage is data here: it is packed, never executed.
  nfpm:
    needs: [version, nfpm-stage]
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the workspace, like everything from that job: extracted over the
      # checkout, its files would replace the scripts and the action that get the key.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfpm-stage-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifact

      - name: Unpack the tree
        run: |
          [ "$(ls -A "$RUNNER_TEMP/stage-artifact")" = "stage.tar.gz" ] \
            || { echo "::error::the stage artifact must hold stage.tar.gz and nothing else"; exit 1; }
          mkdir "$RUNNER_TEMP/stage"
          tar -xpzf "$RUNNER_TEMP/stage-artifact/stage.tar.gz" -C "$RUNNER_TEMP/stage"

      - name: Install nFPM
        run: |
          scripts/build/install_nfpm.sh
          nfpm --version

      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

      - name: Build packages
        env:
          MESHLOOM_REQUIRE_SIGNED: "1"
          MESHLOOM_SIGN_KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ needs.version.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --stage-dir "$RUNNER_TEMP/stage" \
            --package-only \
            --output-dir dist

      - name: Assert the rpm is signed
        run: python3 -I scripts/build/check_rpm_signed.py dist/*.rpm

      # Nothing after this step needs the key, and the actions below do not get to see it.
      - name: Erase the key
        if: always()
        env:
          GNUPGHOME: ${{ steps.key.outputs.gnupghome }}
          KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: rm -rf -- "${GNUPGHOME:-/nonexistent}" "${KEY_FILE:-/nonexistent}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfpm-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [version, frontend, nfpm]
    runs-on: ubuntu-latest
    # Draft + one-file uploads + retries. GitHub's asset API can spend
    # several minutes on a single ~80MB package with no TTY progress.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-zip
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfpm-amd64
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfpm-arm64
          path: artifacts

      # An rc's installer selects the pre-release channel by itself (get.meshloom.app/next).
      - name: Stage install.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/build/stage_install_sh.sh --version "$VERSION" --output artifacts/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exactly the expected files: the artifacts come from jobs running npm and uv.
          scripts/build/list_release_assets.sh \
            --version "${{ needs.version.outputs.version }}" --dir artifacts > "$RUNNER_TEMP/assets"
          ASSET_ARGS=()
          while IFS= read -r file; do
            ASSET_ARGS+=(--asset "$file")
          done < "$RUNNER_TEMP/assets"
          scripts/build/create_github_release.sh \
            --version "${{ needs.version.outputs.version }}" \
            "${ASSET_ARGS[@]}"

  # armhf lives in nfpm-armhf.yml: a GITHUB_TOKEN release does not trigger
  # on.release, but it can workflow_dispatch. That keeps QEMU off this run so
  # a failed publish can be re-run without waiting on emulation. Not for an rc: the
  # armhf recipe comes from the default branch, and nfpm-armhf.yml refuses it.
  dispatch-armhf:
    name: Dispatch armhf package
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start armhf workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nfpm-armhf.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="${{ needs.version.outputs.version }}"

  # meshloom.app builds its docs from the latest tag: rebuild it now that the
  # release is public. Called here because a GITHUB_TOKEN release does not
  # trigger docs-site.yml's on.release. Not for an rc: the site stays on stable.
  docs-site:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/docs-site.yml
    secrets:
      DOCS_SITE_DEPLOY_HOOK: ${{ secrets.DOCS_SITE_DEPLOY_HOOK }}
    permissions: {}

  # Publishes amd64/arm64 immediately. The armhf workflow refreshes the index
  # once that package is attached, rather than holding this run for QEMU. An rc
  # lands in the `testing` suite; stable is rebuilt from the last stable release.
  linux-repo:
    needs: [version, publish]
    uses: ./.github/workflows/publish-linux-repo.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      MESHLOOM_REPO_GPG_PRIVATE_KEY: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write

  # SHA256SUMS + OCI-DIGESTS and their .asc (packages, zip, install.sh; image digest).
  # Waits for docker.yml's image. Re-run by nfpm-armhf.yml once armhf is attached.
  sign-manifest:
    needs: [version, publish]
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      MESHLOOM_REPO_GPG_PRIVATE_KEY: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
      attestations: write

  # Same workflow as nfpm/publish so the .deb is already an artifact and the
  # GITHUB_TOKEN can attach the image. A separate on.release workflow would
  # never start.
  rpi-image:
    needs: [version, nfpm, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfpm-arm64
          path: incoming

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kpartx xz-utils fdisk cloud-guest-utils e2fsprogs

      - name: Build Raspberry Pi Lite image
        run: |
          chmod +x scripts/build/build_rpi_image.sh
          DEB="$(find incoming -name '*_arm64.deb' | head -n 1)"
          [ -n "$DEB" ] || { echo "arm64 .deb missing from nfpm-arm64 artifact" >&2; exit 1; }
          sudo scripts/build/build_rpi_image.sh --deb "$DEB" --output-dir dist \
            --version "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshloom-rpi-lite-arm64
          path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest
          if-no-files-found: error

      - name: Attest provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest

      - name: Attach image to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.version }}" \
            dist/meshloom-rpi-lite-arm64.img.xz \
            dist/meshloom.rpi-imager-manifest \
            --repo "${{ github.repository }}" \
            --clobber
