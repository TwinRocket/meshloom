name: Raspberry Pi image

# Rebuild an image for a version that already has an arm64 .deb on GitHub.
# Normal releases bake the image in the Release workflow after nfpm/publish.
# Do not run on pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Meshloom version whose arm64 .deb to bake (no v prefix)"
        required: true

permissions: {}

concurrency:
  group: rpi-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Recipe always comes from default branch. The input version only
      # selects which already-published arm64 .deb to bake. Dispatching
      # this workflow from the 4.12.0 tag reuses the pre-fix script.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kpartx xz-utils fdisk cloud-guest-utils e2fsprogs

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download arm64 package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p incoming
          VERSION="${{ steps.ver.outputs.version }}"
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            --dir incoming --pattern "*_arm64.deb" || \
          gh release download "${VERSION}" --repo "${{ github.repository }}" \
            --dir incoming --pattern "*_arm64.deb"
          ls -la incoming

      - name: Build image
        run: |
          chmod +x scripts/build/build_rpi_image.sh
          sudo scripts/build/build_rpi_image.sh \
            --deb incoming/*_arm64.deb \
            --output-dir dist \
            --version "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meshloom-rpi-lite-arm64
          path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest
          if-no-files-found: error

      - name: Attest provenance of the image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/meshloom-rpi-lite-arm64.img.xz
            dist/meshloom.rpi-imager-manifest

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release upload "${VERSION}" \
            dist/meshloom-rpi-lite-arm64.img.xz \
            dist/meshloom.rpi-imager-manifest \
            --repo "${{ github.repository }}" \
            --clobber
