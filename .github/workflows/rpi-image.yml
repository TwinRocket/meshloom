name: Raspberry Pi image

# Large privileged build. Do not run on pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Meshloom version whose arm64 .deb to bake (no v prefix)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: rpi-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support kpartx xz-utils fdisk

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Download arm64 package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p incoming
          VERSION="${{ steps.ver.outputs.version }}"
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            --dir incoming --pattern "*_arm64.deb" || \
          gh release download "${VERSION}" --repo "${{ github.repository }}" \
            --dir incoming --pattern "*_arm64.deb"
          ls -la incoming

      - name: Build image
        run: |
          chmod +x scripts/build/build_rpi_image.sh
          sudo scripts/build/build_rpi_image.sh \
            --deb incoming/*_arm64.deb \
            --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshloom-rpi-lite-arm64
          path: dist/meshloom-rpi-lite-arm64.img.xz
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/meshloom-rpi-lite-arm64.img.xz \
            --repo "${{ github.repository }}" \
            --clobber
