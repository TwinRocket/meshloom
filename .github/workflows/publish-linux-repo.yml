name: Publish Linux apt/dnf repo

# Rebuilds a static, SIGNED apt + dnf repository from one release's packages and
# deploys it to GitHub Pages.
#
# Fails closed: no signing key, a missing package (amd64, arm64 and, when
# asked, armhf) or an unsigned .rpm stops the run instead of publishing a
# repository that clients cannot verify.
#
# Published next to the metadata: InRelease + Release.gpg (apt), repomd.xml.asc
# (dnf), meshloom.gpg (binary) and meshloom.asc (armored), both copied from
# pkg/keys so clients get the key committed in git, not whatever the secret
# exports.
#
# Existing clients (trusted=yes / gpgcheck=0) ignore all of that and keep
# working; see pkg/keys/README.md ("Why publishing a signed repository cannot
# break existing clients").

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (default: latest release)"
        required: false
      require_armhf:
        description: "Fail unless the armhf .deb is attached"
        type: boolean
        default: false
      allow_unsigned_rpm:
        description: "Step 0 of the signing roll-out only: tolerate .rpm files built before signing existed"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Release version to publish (default: latest release)"
        type: string
        required: false
        default: ""
      require_armhf:
        description: "Fail unless the armhf .deb is attached"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: linux-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev createrepo-c gnupg jq

      # No key, no repository: this runs before any package is touched.
      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MESHLOOM_REPO_GPG_PASSPHRASE }}

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${INPUT_VERSION:-${EVENT_TAG:-}}"
          if [ -z "$VERSION" ]; then
            VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not X.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # No error swallowing here: an empty or partial download used to publish an empty or
      # stale repository and report success.
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.rel.outputs.version }}
          REQUIRE_ARMHF: ${{ inputs.require_armhf }}
        run: |
          mkdir -p incoming
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern "*.deb" --pattern "*.rpm"
          ls -la incoming
          need() { compgen -G "incoming/$1" >/dev/null || { echo "::error::release $VERSION has no package matching $1"; exit 1; }; }
          need '*_amd64.deb'
          need '*_arm64.deb'
          need '*.x86_64.rpm'
          need '*.aarch64.rpm'
          if [ "$REQUIRE_ARMHF" = "true" ]; then need '*_armhf.deb'; fi

      # Packages are signed by nFPM at build time (pkg/nfpm). Refuse anything
      # else, so dnf with gpgcheck=1 can install every file we serve.
      - name: Assert .rpm packages are signed
        env:
          ALLOW_UNSIGNED_RPM: ${{ inputs.allow_unsigned_rpm }}
        run: |
          if ! python3 -I scripts/build/check_rpm_signed.py incoming/*.rpm; then
            if [ "$ALLOW_UNSIGNED_RPM" = "true" ]; then
              echo "::warning::publishing .rpm files without a signature (allow_unsigned_rpm); only valid for clients with gpgcheck=0"
            else
              echo "::error::unsigned .rpm in the release. Publish a release built after signing was enabled."
              exit 1
            fi
          fi

      - name: Build apt and rpm trees
        run: |
          mkdir -p public/apt/pool/main
          mkdir -p public/rpm/x86_64 public/rpm/aarch64
          shopt -s nullglob
          for deb in incoming/*.deb; do
            cp "$deb" public/apt/pool/main/
          done
          for rpm in incoming/*.rpm; do
            case "$rpm" in
              *aarch64*|*arm64*) cp "$rpm" public/rpm/aarch64/ ;;
              *) cp "$rpm" public/rpm/x86_64/ ;;
            esac
          done
          if compgen -G "public/apt/pool/main/*.deb" > /dev/null; then
            (
              cd public/apt
              # Read from the packages rather than listed here. The list was
              # written in three places, and an architecture missing from one of
              # them is a repository that offers itself to a machine it cannot
              # serve: that is what left a 32-bit Raspberry Pi with no candidate.
              ARCHES="$(for d in pool/main/*.deb; do dpkg-deb -f "$d" Architecture; done | sort -u)"
              for a in $ARCHES; do
                mkdir -p "dists/stable/main/binary-$a"
                dpkg-scanpackages --arch "$a" pool /dev/null > "dists/stable/main/binary-$a/Packages"
                gzip -k -f "dists/stable/main/binary-$a/Packages"
              done
              apt-ftparchive -o APT::FTPArchive::Release::Origin=Meshloom \
                -o APT::FTPArchive::Release::Label=Meshloom \
                -o APT::FTPArchive::Release::Suite=stable \
                -o APT::FTPArchive::Release::Codename=stable \
                -o APT::FTPArchive::Release::Architectures="$(echo $ARCHES)" \
                -o APT::FTPArchive::Release::Components=main \
                release dists/stable > dists/stable/Release
            )
          fi
          createrepo_c public/rpm/x86_64
          createrepo_c public/rpm/aarch64
          for f in public/apt/dists/stable/Release public/rpm/x86_64/repodata/repomd.xml public/rpm/aarch64/repodata/repomd.xml; do
            [ -f "$f" ] || { echo "::error::$f was not generated"; exit 1; }
          done

      - name: Sign metadata and publish the public key
        env:
          GNUPGHOME: ${{ steps.key.outputs.gnupghome }}
          GPG_PASSPHRASE: ${{ secrets.MESHLOOM_REPO_GPG_PASSPHRASE }}
          KEY_ID: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -u "$KEY_ID" "$@"; }
          sign --clearsign -o public/apt/dists/stable/InRelease public/apt/dists/stable/Release
          sign --detach-sign -a -o public/apt/dists/stable/Release.gpg public/apt/dists/stable/Release
          for arch in x86_64 aarch64; do
            sign --detach-sign -a -o "public/rpm/${arch}/repodata/repomd.xml.asc" \
              "public/rpm/${arch}/repodata/repomd.xml"
          done
          # The key clients download is the one committed in git.
          cp pkg/keys/meshloom-archive-keyring.gpg public/meshloom.gpg
          cp pkg/keys/meshloom.asc public/meshloom.asc

      # Verify like a client would, with the published key and nothing else.
      - name: Verify published signatures
        run: |
          set -euo pipefail
          K="$PWD/public/meshloom.gpg"
          gpgv --keyring "$K" public/apt/dists/stable/InRelease
          gpgv --keyring "$K" public/apt/dists/stable/Release.gpg public/apt/dists/stable/Release
          for arch in x86_64 aarch64; do
            gpgv --keyring "$K" "public/rpm/${arch}/repodata/repomd.xml.asc" "public/rpm/${arch}/repodata/repomd.xml"
          done
          ls public/apt/dists/stable/main

      - name: Write index
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <title>Meshloom Linux repo</title>
          <p>apt: <code>https://twinrocket.github.io/meshloom/apt</code></p>
          <p>dnf: <code>https://twinrocket.github.io/meshloom/rpm/\$basearch</code></p>
          <p>keys: <a href="meshloom.asc">meshloom.asc</a>, <a href="meshloom.gpg">meshloom.gpg</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
