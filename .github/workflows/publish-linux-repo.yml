name: Publish Linux apt/dnf repo

# Rebuilds a static, SIGNED apt + dnf repository and deploys it to GitHub Pages.
# Pages replaces the whole site on each deployment, so every run rebuilds both
# suites from the published releases (scripts/build/resolve_linux_repo_channels.py),
# whichever release started it:
#
#   apt stable,  rpm/$basearch          the last stable X.Y.Z release
#   apt testing, rpm/testing/$basearch  the newest X.Y.Z-rc.N if it is newer than
#                                       stable (no armhf), otherwise stable
#
# Fails closed: no signing key, a missing package (amd64, arm64 and, when
# asked, armhf), an unsigned package or one of another version in stable stops the run
# instead of publishing a repository that clients cannot verify. Nothing is deployed
# then, so the live repository stays as it was.
#
# Published next to the metadata: InRelease + Release.gpg (apt), repomd.xml.asc
# (dnf), meshloom.gpg (binary) and meshloom.asc (armored), both copied from
# pkg/keys so clients get the key committed in git, not whatever the secret
# exports.
#
# The key and the Pages token are in separate jobs: `build` signs, `deploy` deploys.
# A version of this file without the testing suite (main, until preversion-5 merges)
# drops that suite when it runs: see docs/dev/releasing.md for the recovery.
#
# Existing clients (trusted=yes / gpgcheck=0) ignore all of that and keep
# working; see pkg/keys/README.md ("Why publishing a signed repository cannot
# break existing clients").

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (default: latest release)"
        required: false
      require_armhf:
        description: "Fail unless the armhf .deb is attached"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Release version to publish (default: latest release)"
        type: string
        required: false
        default: ""
      require_armhf:
        description: "Fail unless the armhf .deb is attached"
        type: boolean
        default: false
    secrets:
      MESHLOOM_REPO_GPG_PRIVATE_KEY:
        required: false

permissions: {}

concurrency:
  group: linux-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev createrepo-c gnupg jq

      - name: Resolve what each suite serves
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUIRE_ARMHF: ${{ inputs.require_armhf }}
        run: |
          VERSION="${INPUT_VERSION:-${EVENT_TAG:-}}"
          VERSION="${VERSION#v}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease, assets: [.assets[].name]}' > "$RUNNER_TEMP/releases.jsonl"
          # Stable follows GitHub's latest release unless this run publishes an
          # X.Y.Z. A failed lookup stops the run here.
          LATEST=""
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          ARGS=(--releases "$RUNNER_TEMP/releases.jsonl" --latest "$LATEST" --version "$VERSION")
          if [ "$REQUIRE_ARMHF" = "true" ]; then ARGS+=(--require-armhf); fi
          # Not piped: this step has no pipefail, and a refusal must stop it.
          python3 -I scripts/build/resolve_linux_repo_channels.py "${ARGS[@]}" > "$RUNNER_TEMP/channels"
          cat "$RUNNER_TEMP/channels"
          cat "$RUNNER_TEMP/channels" >> "$GITHUB_OUTPUT"

      # Stable fails closed. An rc other than the one this run publishes is left out
      # with a warning: it must not stop a stable publication.
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ steps.rel.outputs.stable }}
          TESTING: ${{ steps.rel.outputs.testing }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUIRE_ARMHF: ${{ inputs.require_armhf }}
        run: |
          REQUESTED="${INPUT_VERSION:-${EVENT_TAG:-}}"
          ARGS=(--stable "$STABLE" --testing "$TESTING" --requested "${REQUESTED#v}" \
            --incoming incoming --keyring pkg/keys/meshloom-archive-keyring.gpg)
          if [ "$REQUIRE_ARMHF" = "true" ]; then ARGS+=(--require-armhf); fi
          scripts/build/fetch_linux_repo_packages.sh "${ARGS[@]}"

      - name: Build apt and rpm trees
        env:
          STABLE: ${{ steps.rel.outputs.stable }}
          TESTING: ${{ steps.rel.outputs.testing }}
        run: |
          ARGS=(--stable-dir incoming/stable --stable-version "$STABLE" --output public)
          if [ -d incoming/testing ]; then
            ARGS+=(--testing-dir incoming/testing --testing-version "$TESTING")
          fi
          scripts/build/build_linux_repo.sh "${ARGS[@]}"

      # Last thing before signing. No key, no repository: nothing was deployed yet.
      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

      - name: Sign metadata and publish the public key
        env:
          GNUPGHOME: ${{ steps.key.outputs.gnupghome }}
          KEY_ID: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "" -u "$KEY_ID" "$@"; }
          for suite in stable testing; do
            sign --clearsign -o "public/apt/dists/${suite}/InRelease" "public/apt/dists/${suite}/Release"
            sign --detach-sign -a -o "public/apt/dists/${suite}/Release.gpg" "public/apt/dists/${suite}/Release"
          done
          for arch in x86_64 aarch64; do
            for dir in "public/rpm/${arch}" "public/rpm/testing/${arch}"; do
              sign --detach-sign -a -o "${dir}/repodata/repomd.xml.asc" "${dir}/repodata/repomd.xml"
            done
          done
          # The key clients download is the one committed in git.
          cp pkg/keys/meshloom-archive-keyring.gpg public/meshloom.gpg
          cp pkg/keys/meshloom.asc public/meshloom.asc

      # Nothing after this step needs the key, and the actions below do not get to see it.
      - name: Erase the key
        if: always()
        env:
          GNUPGHOME: ${{ steps.key.outputs.gnupghome }}
          KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: rm -rf -- "${GNUPGHOME:-/nonexistent}" "${KEY_FILE:-/nonexistent}"

      # Verify like a client would, with the published key and nothing else.
      - name: Verify published signatures
        run: |
          set -euo pipefail
          K="$PWD/public/meshloom.gpg"
          for suite in stable testing; do
            gpgv --keyring "$K" "public/apt/dists/${suite}/InRelease"
            gpgv --keyring "$K" "public/apt/dists/${suite}/Release.gpg" "public/apt/dists/${suite}/Release"
            ls "public/apt/dists/${suite}/main"
          done
          for arch in x86_64 aarch64; do
            for dir in "public/rpm/${arch}" "public/rpm/testing/${arch}"; do
              gpgv --keyring "$K" "${dir}/repodata/repomd.xml.asc" "${dir}/repodata/repomd.xml"
            done
          done

      - name: Write index
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <title>Meshloom Linux repo</title>
          <p>apt: <code>https://twinrocket.github.io/meshloom/apt</code></p>
          <p>dnf: <code>https://twinrocket.github.io/meshloom/rpm/\$basearch</code></p>
          <p>Pre-releases, suite <code>testing</code> of the apt URL above, and dnf: <code>https://twinrocket.github.io/meshloom/rpm/testing/\$basearch</code></p>
          <p>keys: <a href="meshloom.asc">meshloom.asc</a>, <a href="meshloom.gpg">meshloom.gpg</a></p>
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
