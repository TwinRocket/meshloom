name: All Quality

# Also a reusable workflow: docker.yml and release.yml call it and wait for it
# (`needs:`) before building or publishing anything. Tag pushes are therefore
# not a trigger here: the release and the image run it themselves, once each.
# Every branch and every pull request, whatever its base: main and the 5.0.0
# integration branch preversion-5 are both covered without being named. A
# forward-merge into preversion-5 (forward-merge.yml) is merged with GITHUB_TOKEN
# and starts nothing; the docker.yml run it dispatches calls this workflow.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  backend-checks:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11. 3.12 is the dev baseline, 3.13 is Debian
        # trixie's python3 (the plugin host runs on it in deb installs), 3.14 is
        # what the Docker image ships.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      # Make uv use the interpreter under test, not whichever it finds first.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Backend lint
        run: uv run ruff check

      - name: Backend format check
        run: uv run ruff format --check

      - name: Backend typecheck
        run: uv run pyright app/ meshloom_plugin/

      # The bwrap isolation level of the plugin child (app/plugins/isolation/bwrap.py):
      # its integration tests and the hostile corpus run under it here. Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor; the runner
      # lifts that so the tests exercise bwrap itself. The check makes a broken
      # sandbox fail the job instead of skipping those tests.
      - name: Install bubblewrap for the plugin isolation tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          PYTHONPATH=. uv run python -c "from app.plugins.isolation.bwrap import self_test; e = self_test(); assert e is None, e"

      - name: Backend tests
        # Quiet per-test output: with xdist the -v lines interleave and a log
        # that stops early shows no verdict. -rfE prints a FAILED/ERROR line per
        # failure in the final summary, --tb=short keeps tracebacks readable, the
        # JUnit XML feeds the step summary and the artifact below, and
        # faulthandler_timeout dumps every thread's stack if a test hangs.
        run: >-
          PYTHONPATH=. uv run pytest tests/ -q -rfE --tb=short
          -o faulthandler_timeout=300
          --junitxml=pytest-report.xml

      # always(): this is the step that matters when the tests step failed or
      # was killed.
      - name: Failed tests summary
        if: ${{ always() }}
        run: python3 scripts/ci/junit_summary.py pytest-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pytest report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14

  # The dedicated-uid isolation level (app/plugins/isolation/setuid.py) needs a
  # root server and the meshloom-plugin account, as in the Docker image: a root
  # container, on the oldest supported Python (3.11 has no thread-start audit
  # event: the corpus checks RLIMIT_NPROC instead) and on the image's 3.14. The
  # stdlib-only plugin tests run first (`--noconftest`, including the seccomp
  # filter that keeps a root child from forking or exec'ing), then the hostile
  # corpus, the RPC fuzz and the host tests with the app's dependencies (the
  # corpus drives the real supervisor), at `none` and `setuid`. The same tests
  # then run as a non-root server holding only CAP_SETUID and CAP_SETGID ambient,
  # as docker-entrypoint.sh starts it under MESHLOOM_RUN_AS_USER. The container
  # is unprivileged, so the bwrap cases skip here; the backend job runs them.
  plugin-isolation-root:
    name: Plugin isolation as root (Python ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "3.11"
            digest: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
          - image: "3.14"
            digest: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    container:
      image: ${{ matrix.digest }}
    permissions:
      contents: read
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the plugin account and open the checkout to it
        run: |
          groupadd --system --gid 10002 meshloom-plugin
          useradd --system --uid 10002 --gid meshloom-plugin --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin meshloom-plugin
          chmod -R a+rX "$GITHUB_WORKSPACE"
          d="$GITHUB_WORKSPACE"; while [ "$d" != / ]; do chmod a+x "$d"; d=$(dirname "$d"); done
          pip install --no-cache-dir -q pytest
          PYTHONPATH=. python -c "from tests.plugin_isolation_support import available_backends as a; assert 'setuid' in a(), a()"

      - name: Plugin isolation and runner tests
        run: PYTHONPATH=. python -m pytest --noconftest -p no:cacheprovider -o addopts= -v tests/test_plugin_isolation.py tests/test_plugin_runner.py tests/test_plugin_seccomp.py

      # uv pinned like the Dockerfile's UV_VERSION; the interpreter is the image's.
      - name: Hostile plugin corpus and RPC fuzz under every isolation level
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          pip install --no-cache-dir -q "uv==0.6.17"
          uv sync --frozen --dev --python "$(command -v python)"
          PYTHONPATH=. uv run --frozen pytest -p no:cacheprovider -o addopts= -v tests/test_plugin_corpus.py tests/test_plugin_rpc_fuzz.py tests/test_plugin_host.py

      # setpriv as docker-entrypoint.sh calls it: uid 10001 keeps exactly
      # CAP_SETUID and CAP_SETGID ambient, enough for the setuid level.
      - name: Plugin tests as a non-root server with CAP_SETUID/CAP_SETGID
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          install -d -o 10001 -g 10001 -m 0700 /tmp/caps-home
          setpriv --reuid=10001 --regid=10001 --clear-groups \
            --inh-caps=-all,+setgid,+setuid --ambient-caps=+setgid,+setuid -- \
            env HOME=/tmp/caps-home PYTHONPATH=. .venv/bin/python -c \
            "from tests.plugin_isolation_support import available_backends as a; assert 'setuid' in a(), a()"
          setpriv --reuid=10001 --regid=10001 --clear-groups \
            --inh-caps=-all,+setgid,+setuid --ambient-caps=+setgid,+setuid -- \
            env HOME=/tmp/caps-home PYTHONPATH=. .venv/bin/python -m pytest -p no:cacheprovider -o addopts= -v \
            tests/test_plugin_isolation.py tests/test_plugin_runner.py tests/test_plugin_seccomp.py \
            tests/test_plugin_corpus.py tests/test_plugin_rpc_fuzz.py tests/test_plugin_host.py

  frontend-checks:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend format check
        run: npm run format:check
        working-directory: frontend

      - name: Frontend tests
        run: npm run test:run
        working-directory: frontend

      # All of src/, tests included. `npm run build` only checks what main.tsx reaches.
      - name: Frontend type check
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  # The ntfy transport against a real server (tests/integration/test_ntfy_e2e.py):
  # scripts/quality/ntfy_integration.sh starts the pinned binwiederhier/ntfy image.
  ntfy-integration:
    name: ntfy integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev

      - name: ntfy integration test
        run: ./scripts/quality/ntfy_integration.sh

  # One stable name to require in branch protection and to `needs:` from other
  # workflows, whatever the matrix above grows into.
  all-quality:
    name: all-quality
    if: ${{ always() }}
    needs: [backend-checks, plugin-isolation-root, ntfy-integration, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every quality job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a quality job ended as '$r'"; exit 1; }
          done
