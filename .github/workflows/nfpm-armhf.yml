name: Packages (armhf)

# 32-bit Raspberry Pi package. Assembled under QEMU, packed on the host.
# Dispatched from Release after publish, or by hand with a version input.
# Recipe (this file, Dockerfile, script) comes from the default branch; app
# sources come from the tag so a rattrapage uses the already-fixed builder.
#
# Three jobs so the signing key meets no third-party code: `frontend` runs npm,
# `assemble` runs the build backends, and only `package` holds the key. X.Y.Z only:
# a release candidate has no armhf package.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Meshloom version to package (no v prefix)"
        required: true

permissions: {}

concurrency:
  group: nfpm-armhf-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Strict on purpose: an rc has no armhf package, and this recipe comes from the
  # default branch, not from the rc's commit.
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not X.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

  # npm runs third-party code: no key and no write token here.
  frontend:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-armhf
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  # Build backends run here under QEMU. No key either; the token only writes the
  # buildx registry cache.
  assemble:
    needs: [version, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # buildx registry cache
    steps:
      # Recipe always comes from default branch. Dispatching from a tag would
      # reuse a pre-fix Dockerfile the same way rpi-image.yml avoids that.
      - name: Check out recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
          path: tag-src
          persist-credentials: false

      - name: Version consistency of the tag
        env:
          MESHLOOM_VERSION_ROOT: ${{ github.workspace }}/tag-src
        run: scripts/build/check_version_consistency.sh "${{ needs.version.outputs.version }}"

      - name: Overlay tagged sources
        run: |
          rm -rf app frontend meshloom_plugin
          cp -a tag-src/app tag-src/frontend .
          # Tags before 5.0 have no meshloom_plugin/: ship an empty directory so
          # Dockerfile.nfpm-armhf's COPY and build_nfpm_packages.sh still work.
          if [ -d tag-src/meshloom_plugin ]; then
            cp -a tag-src/meshloom_plugin .
          else
            mkdir -p meshloom_plugin
          fi
          cp tag-src/pyproject.toml tag-src/uv.lock .
          [ -f tag-src/LICENSE.md ] && cp tag-src/LICENSE.md .
          [ -f tag-src/LICENSES.md ] && cp tag-src/LICENSES.md .
          rm -rf tag-src

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-armhf
          path: frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tree
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.nfpm-armhf
          platforms: linux/arm/v7
          provenance: false
          build-args: VERSION=${{ needs.version.outputs.version }}
          outputs: type=local,dest=stage-armhf
          cache-from: type=registry,ref=${{ steps.image.outputs.image }}:buildcache-nfpm-armhf
          cache-to: type=registry,ref=${{ steps.image.outputs.image }}:buildcache-nfpm-armhf,mode=max

      # A tarball: an artifact would lose the symlinks and the file modes.
      - name: Pack the tree
        run: tar -C stage-armhf -czf stage-armhf.tar.gz .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfpm-stage-armhf
          path: stage-armhf.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Holds the key and runs only the checked-out scripts and the pinned nFPM. The
  # tree from `assemble` is data here: it is packed, never executed.
  package:
    needs: [version, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write   # attach the package to the release
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Outside the workspace, like everything from that job: extracted over the
      # checkout, its files would replace the scripts and the action that get the key.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfpm-stage-armhf
          path: ${{ runner.temp }}/stage-artifact

      - name: Unpack the tree
        run: |
          [ "$(ls -A "$RUNNER_TEMP/stage-artifact")" = "stage-armhf.tar.gz" ] \
            || { echo "::error::the stage artifact must hold stage-armhf.tar.gz and nothing else"; exit 1; }
          mkdir "$RUNNER_TEMP/stage-armhf"
          tar -xpzf "$RUNNER_TEMP/stage-artifact/stage-armhf.tar.gz" -C "$RUNNER_TEMP/stage-armhf"

      - name: Install nFPM
        run: scripts/build/install_nfpm.sh

      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

      - name: Pack
        env:
          MESHLOOM_REQUIRE_SIGNED: "1"
          MESHLOOM_SIGN_KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ needs.version.outputs.version }}" \
            --arch armhf \
            --stage-dir "$RUNNER_TEMP/stage-armhf" \
            --package-only \
            --output-dir dist

      # Nothing after this step needs the key, and the actions below do not get to see it.
      - name: Erase the key
        if: always()
        env:
          GNUPGHOME: ${{ steps.key.outputs.gnupghome }}
          KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: rm -rf -- "${GNUPGHOME:-/nonexistent}" "${KEY_FILE:-/nonexistent}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfpm-armhf
          path: dist/*

      - name: Attach armhf package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.version }}" dist/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  # Both re-run now that armhf is attached: the apt index gains the architecture
  # and SHA256SUMS(.asc) is rewritten to include the new .deb.
  linux-repo:
    needs: [package]
    uses: ./.github/workflows/publish-linux-repo.yml
    with:
      version: ${{ needs.package.outputs.version }}
      require_armhf: true
    secrets:
      MESHLOOM_REPO_GPG_PRIVATE_KEY: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write

  sign-manifest:
    needs: [package]
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.package.outputs.version }}
      require_armhf: true
    secrets:
      MESHLOOM_REPO_GPG_PRIVATE_KEY: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
      attestations: write
