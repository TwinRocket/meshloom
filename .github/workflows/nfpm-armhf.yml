name: Packages (armhf)

# 32-bit Raspberry Pi package. Assembled under QEMU, packed on the host.
# Dispatched from Release after publish, or by hand with a version input.
# Recipe (this file, Dockerfile, script) comes from the default branch; app
# sources come from the tag so a rattrapage uses the already-fixed builder.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Meshloom version to package (no v prefix)"
        required: true

permissions: {}

concurrency:
  group: nfpm-armhf-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # attach the package to the release
      packages: write   # buildx registry cache
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not X.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      # Recipe always comes from default branch. Dispatching from a tag would
      # reuse a pre-fix Dockerfile the same way rpi-image.yml avoids that.
      - name: Check out recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out tagged sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.ver.outputs.version }}
          path: tag-src

      - name: Version consistency of the tag
        env:
          MESHLOOM_VERSION_ROOT: ${{ github.workspace }}/tag-src
        run: scripts/build/check_version_consistency.sh "${{ steps.ver.outputs.version }}"

      - name: Import signing key
        id: key
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.MESHLOOM_REPO_GPG_PRIVATE_KEY }}

      - name: Overlay tagged sources
        run: |
          rm -rf app frontend
          cp -a tag-src/app tag-src/frontend .
          cp tag-src/pyproject.toml tag-src/uv.lock .
          [ -f tag-src/LICENSE.md ] && cp tag-src/LICENSE.md .
          [ -f tag-src/LICENSES.md ] && cp tag-src/LICENSES.md .
          rm -rf tag-src

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tree
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.nfpm-armhf
          platforms: linux/arm/v7
          provenance: false
          build-args: VERSION=${{ steps.ver.outputs.version }}
          outputs: type=local,dest=stage-armhf
          cache-from: type=registry,ref=${{ steps.image.outputs.image }}:buildcache-nfpm-armhf
          cache-to: type=registry,ref=${{ steps.image.outputs.image }}:buildcache-nfpm-armhf,mode=max

      - name: Install nFPM
        run: |
          NFPM_VER=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | tar -xz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Pack
        env:
          MESHLOOM_REQUIRE_SIGNED: "1"
          MESHLOOM_SIGN_KEY_FILE: ${{ steps.key.outputs.key-file }}
        run: |
          chmod +x scripts/build/build_nfpm_packages.sh
          scripts/build/build_nfpm_packages.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --arch armhf \
            --stage-dir stage-armhf \
            --package-only \
            --output-dir dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nfpm-armhf
          path: dist/*

      - name: Attach armhf package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.version }}" dist/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  # Both re-run now that armhf is attached: the apt index gains the architecture
  # and SHA256SUMS(.asc) is rewritten to include the new .deb.
  linux-repo:
    needs: [package]
    uses: ./.github/workflows/publish-linux-repo.yml
    with:
      version: ${{ needs.package.outputs.version }}
      require_armhf: true
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  sign-manifest:
    needs: [package]
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.package.outputs.version }}
      require_armhf: true
    secrets: inherit
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
      attestations: write
