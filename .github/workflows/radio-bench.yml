name: Radio bench

# Manual only: the opt-in radio bench (docs/dev/radio-bench.md) against an
# instance reachable from a GitHub-hosted runner. It never runs on a
# self-hosted runner, and never on push or pull request.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Instance base URL (MESHLOOM_RADIO_BENCH_URL)"
        required: true
        type: string
      proxy:
        description: "Radio proxy host:port (MESHLOOM_RADIO_BENCH_PROXY); empty skips the proxy tests"
        required: false
        type: string
        default: ""
      channel:
        description: "Adopted channel used for sends (MESHLOOM_RADIO_BENCH_CHANNEL)"
        required: false
        type: string
        default: "#meshloom-next-test"

permissions: {}

# One radio: never two runs at once.
concurrency:
  group: radio-bench
  cancel-in-progress: false

jobs:
  radio-bench:
    name: Radio bench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      MESHLOOM_RADIO_BENCH_URL: ${{ inputs.base_url }}
      MESHLOOM_RADIO_BENCH_PROXY: ${{ inputs.proxy }}
      MESHLOOM_RADIO_BENCH_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Run the radio bench
        run: uv run pytest tests/radio_bench -m radio -n 0 -v
